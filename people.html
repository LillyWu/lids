  <style>

    /* --------------------------------
       Page layout
    -------------------------------- */

    .people-page {
      margin-top: 30px;
      margin-bottom: 40px;
      min-height: 0;
    }

    /* --------------------------------
       Recruitment notice
    -------------------------------- */

    .recruiting-notice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;

      margin: 16px 0 28px;
      padding: 20px 24px;

      background: #eef6f0;
      border: 1px solid #cbded0;
      border-left: 5px solid var(--accent);
      border-radius: 8px;

      color: #111;
    }

    .recruiting-notice p {
      margin: 0;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      color: #000;
    }

    .recruiting-notice strong {
      display: block;
      margin-bottom: 6px;

      color: #145637;
      font-size: 1.3rem;
    }

    .recruiting-notice a {
      display: inline-block;

      padding: 10px 16px;

      background: #007c41;
      color: #fff;

      border-radius: 5px;

      font-weight: 600;
      white-space: nowrap;
      text-decoration: none;
    }

    .recruiting-notice a:hover {
      background: #105b36;
      text-decoration: none;
    }

    /* --------------------------------
       People sections
    -------------------------------- */

    #people .people-section {
      margin-bottom: 28px;
    }

    #people .people-section h2 {
      margin-bottom: 18px;
    }

    /* --------------------------------
       Photo left, biography right
    -------------------------------- */

    #people .person {
      display: grid;

      grid-template-columns:
        220px minmax(0, 1fr);

      align-items: start;
      gap: 24px;

      margin: 16px 0 28px;
    }

    /* Portrait */
    #people .portrait {
      width: 220px;
      max-width: 100%;
      margin: 0;
      align-self: center;
    }

    #people .portrait img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Right column */
    #people .person-body {
      min-width: 0;
      width: 100%;
    }

    /* --------------------------------
       Name and affiliation
    -------------------------------- */

    #people .person-body h3 {
      margin: 0 0 8px;

      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.3;

      color: var(--text);
    }

    #people .person-position,
    #people .person-affiliation {
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.5;

      margin: 0 0 6px;

      color: var(--text);
    }

    /* --------------------------------
       Biography
    -------------------------------- */

    #people .person-body .person-bio {
      font-size: 1.0rem;
      font-weight: 400;
      line-height: 1.5;

      color: #000;

      text-align: justify;

      margin: 12px 0 0;

      max-width: 100%;
    }

    /* --------------------------------
       Links BELOW biography
    -------------------------------- */

    #people .person-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;

      gap: 8px;

      margin: 12px 0 0;

      font-size: 0.9rem;
      line-height: 1.5;
    }

    #people .person-links a {
      color: var(--accent);
      text-decoration: none;
    }

    #people .person-links a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    #people .link-separator {
      color: #6b7280;
    }

    /* --------------------------------
       Other profile information
    -------------------------------- */

    #people .contact {
      margin: 8px 0;
      font-size: 1rem;
    }

    #people .bio-placeholder {
      color: #687078;
      font-size: 1rem;
      line-height: 1.5;
    }

    /* --------------------------------
       Responsive layout
    -------------------------------- */

    @media (max-width: 850px) {

      .people-page {
        margin-top: 20px;
      }

      #people .person {
        grid-template-columns:
          180px minmax(0, 1fr);

        gap: 20px;
      }

      #people .portrait {
        width: 180px;
      }

    }

    @media (max-width: 650px) {

      .recruiting-notice {
        align-items: flex-start;
        flex-direction: column;

        gap: 14px;
        padding: 18px;
      }

      #people .person {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      #people .portrait {
        width: 220px;
        max-width: 100%;
      }

      #people .person-body {
        width: 100%;
      }

    }

  </style>
</head>
